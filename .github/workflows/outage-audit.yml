name: Outage source audit
on:
  pull_request:
    paths:
      - 'research/outage_ml/**'
      - 'docs/outage-ml/**'
      - '.github/workflows/outage-audit.yml'
      - 'requirements-ml.lock'
  push:
    branches: [main]
    paths:
      - 'research/outage_ml/**'
      - 'docs/outage-ml/**'
      - '.github/workflows/outage-audit.yml'
      - 'requirements-ml.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            research/outage_ml
            docs/outage-ml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify cache absence and install existing hash-pinned research environment
        run: |
          test ! -e data
          python -m pip install --require-hashes -r requirements-ml.lock
          python -m pip check
      - name: Audit contracts and committed aggregate integrity
        run: |
          python -m unittest discover -s research/outage_ml/tests -v
          python -m research.outage_ml verify --output docs/outage-ml/presentation
      - name: Regenerate figures and tables twice without source downloads
        run: |
          python -m research.outage_ml report --output /tmp/outage-report-a
          python -m research.outage_ml report --output /tmp/outage-report-b
          diff -r /tmp/outage-report-a /tmp/outage-report-b
          cmp docs/outage-ml/presentation/MEASURED.md /tmp/outage-report-a/MEASURED.md
